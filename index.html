<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Landing Page</title>
    <style>
        /* CSS Sederhana untuk Tampilan & Pop-up */
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; margin: 10px auto; max-width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .card:hover { transform: scale(1.02); }
        
        /* Modal / Pop-up background */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        /* Modal content box */
        .modal-content { background: white; padding: 25px; width: 90%; max-width: 400px; border-radius: 10px; text-align: left; position: relative; }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #888; }
        .wa-btn { display: block; background: #25D366; color: white; text-align: center; padding: 12px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 20px; }
        .wa-btn:hover { background: #20ba5a; }
    </style>
</head>
<body>

    <h2>Pilih Paket Laundry</h2>

    <!-- Kartu Paket 1 -->
    <div class="card" onclick="openModal('Paket Express 2 Jam', 'Pakaian dicuci super cepat menggunakan deterjen premium ramah lingkungan, langsung disetrika rapi dan siap pakai dalam 2 jam.')">
        <h3>Paket Express 2 Jam</h3>
        <p>Klik untuk lihat detail & pesan</p>
    </div>

    <!-- Kartu Paket 2 -->
    <div class="card" onclick="openModal('Paket Kiloan Reguler', 'Cuci kering setrika harian bersih maksimal, estimasi selesai 24 jam dengan wangi tahan lama.')">
        <h3>Paket Kiloan Reguler</h3>
        <p>Klik untuk lihat detail & pesan</p>
    </div>

    <!-- Struktur Pop-up (Modal) -->
    <div id="paketModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-top:0; color:#333;"></h2>
            <p id="modalDesc" style="color: #666; line-height: 1.5;"></p>
            <a id="waLink" href="#" target="_blank" class="wa-btn">Pesan via WhatsApp 🚀</a>
        </div>
    </div>

    <script>
        // Ganti nomor WhatsApp di bawah ini dengan nomor bisnis Anda (format internasional tanpa tanda +, misal: 6281234567890)
        const nomorWA = "6281234567890"; 

        function openModal(namaPaket, deskripsiPaket) {
            document.getElementById("modalTitle").innerText = namaPaket;
            document.getElementById("modalDesc").innerText = deskripsiPaket;

            // Membuat format pesan otomatis untuk WA
            let pesan = `Halo, aku ingin laundry paket *${namaPaket}* nih. Tolong info detail penjemputannya ya!`;
            let encodedPesan = encodeURIComponent(pesan);

            // Set link tombol ke wa.me dengan teks yang sudah di-generate otomatis
            document.getElementById("waLink").href = `https://wa.me/${nomorWA}?text=${encodedPesan}`;

            // Tampilkan modal
            document.getElementById("paketModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("paketModal").style.display = "none";
        }

        // Tutup modal jika user klik di luar kotak putih pop-up
        window.onclick = function(event) {
            let modal = document.getElementById("paketModal");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
